<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics4Fun Admin</title><style>body{font:16px system-ui;background:#0b172a;color:#fff;margin:0;padding:24px}main{max-width:1100px;margin:auto}section{background:#192b46;border:1px solid #49607e;border-radius:14px;padding:20px;margin:20px 0}input,select,button{padding:10px;margin:5px;border-radius:8px;font:inherit}button{cursor:pointer}input,select{max-width:100%}.user{border-bottom:1px solid #566b85;padding:12px 0}label{display:inline-grid;gap:4px}a{color:#ffcf67}[hidden]{display:none!important}</style><main><p><a href="topics.html">← Topics</a></p><h1>⚛ Physics4Fun Super Admin</h1><p>CBSE · ICSE · State Board</p><section id="message">Checking Firebase administrator access…</section><div id="dashboard" hidden><section><h2>Teachers and students</h2><button id="refresh">Refresh users</button><div id="users"></div></section><section><h2>Content records</h2><p>Manage resource links and publication status. Existing static lessons are not automatically changed.</p><form id="contentForm"><label>Board<select id="board"><option>CBSE</option><option>ICSE</option><option>State Board</option></select></label><label>Grade<select id="grade"></select></label><label>Subject<input id="subject" required></label><label>Chapter<input id="chapter" required></label><label>Title<input id="title" required></label><label>Resource URL<input id="url" type="url" required></label><label>Status<select id="status"><option>draft</option><option>published</option></select></label><button type="submit">Save content</button></form><div id="content"></div></section></div></main><script type="module">
const $=id=>document.getElementById(id);for(let n=1;n<=12;n++)$('grade').add(new Option('Class '+n,n));const config={apiKey:"AIzaSyA_aey0TuHl3aAOnt820wnp-Hzf4vardB4",authDomain:"physics4fun-eea28.firebaseapp.com",projectId:"physics4fun-eea28",appId:"1:614636504026:web:7d7ede9c97276a8fe336e3"};let db,fs,auth;
function msg(t){$('message').textContent=t}
function node(t,text){const x=document.createElement(t);if(text!==undefined)x.textContent=text;return x}
function btn(text,fn){const b=node('button',text);b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){alert(e.message)}finally{b.disabled=false}};return b}
function sel(values,current){const s=node('select');for(const v of values)s.add(new Option(v,v));s.value=current||values[0];return s}
async function users(){const root=$('users');root.replaceChildren(node('p','Loading…'));try{const snap=await fs.getDocs(fs.collection(db,'users'));root.replaceChildren();for(const d of snap.docs){const u=d.data(),div=node('div');div.className='user';div.append(node('strong',(u.name||'Unnamed')+' — '+(u.email||'')),node('p',[u.role,u.status,u.board||'No board',u.grade||'No grade'].join(' · ')));const update=async patch=>{await fs.updateDoc(d.ref,patch);await users()};if(u.role==='teacher'&&u.status==='pending')div.append(btn('Approve teacher',()=>update({status:'active'})));div.append(btn(u.status==='disabled'?'Enable':'Disable',()=>update({status:u.status==='disabled'?'active':'disabled'})));const board=sel(['Unassigned','CBSE','ICSE','State Board'],u.board||'Unassigned'),grade=sel(['Unassigned',...Array.from({length:12},(_,i)=>String(i+1))],u.grade||'Unassigned');div.append(board,grade,btn('Save board / grade',()=>update({board:board.value==='Unassigned'?fs.deleteField():board.value,grade:grade.value==='Unassigned'?fs.deleteField():grade.value})));root.append(div)}if(snap.empty)root.append(node('p','No registered users'))}catch(e){root.replaceChildren(node('p','Unable to list users: '+e.message))}}
async function content(){const root=$('content');root.replaceChildren(node('p','Loading…'));try{const snap=await fs.getDocs(fs.collection(db,'content'));root.replaceChildren();for(const d of snap.docs){const c=d.data(),div=node('div');div.className='user';div.append(node('strong',c.title),node('p',[c.board,c.grade,c.subject,c.chapter,c.status].join(' · ')));const a=node('a','Open resource');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';div.append(a,btn(c.status==='published'?'Unpublish':'Publish',async()=>{await fs.updateDoc(d.ref,{status:c.status==='published'?'draft':'published',updatedAt:fs.serverTimestamp()});await content()}),btn('Delete',async()=>{if(confirm('Delete content record?')){await fs.deleteDoc(d.ref);await content()}}));root.append(div)}if(snap.empty)root.append(node('p','No content records'))}catch(e){root.replaceChildren(node('p','Unable to load content: '+e.message))}}
$('refresh').onclick=users;$('contentForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await fs.addDoc(fs.collection(db,'content'),{board:$('board').value,grade:$('grade').value,subject:$('subject').value.trim(),chapter:$('chapter').value.trim(),title:$('title').value.trim(),url:$('url').value.trim(),status:$('status').value,createdBy:auth.currentUser.uid,createdAt:fs.serverTimestamp(),updatedAt:fs.serverTimestamp()});e.target.reset();await content()}catch(err){alert(err.message)}finally{b.disabled=false}};
try{const [{initializeApp},a,f]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);fs=f;const app=initializeApp(config);auth=a.getAuth(app);db=f.getFirestore(app);a.onAuthStateChanged(auth,async user=>{if(!user){msg('Please sign in on the Physics4Fun homepage first.');return}try{const t=await user.getIdTokenResult(true);if(t.claims.admin!==true){msg('Access denied: your account needs a secure Firebase admin custom claim.');return}msg('Administrator verified: '+user.email);$('dashboard').hidden=false;await Promise.all([users(),content()])}catch(e){msg('Access check failed: '+e.message)}})}catch(e){msg('Firebase loading error: '+e.message)}
</script>
