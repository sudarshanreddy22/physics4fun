<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Velocity-time graph for second equation of motion">
<rect width="800" height="500" fill="white"/>
<!-- axes -->
<line x1="90" y1="410" x2="735" y2="410" stroke="#173b68" stroke-width="4"/>
<polygon points="735,410 720,402 720,418" fill="#173b68"/>
<line x1="90" y1="410" x2="90" y2="55" stroke="#173b68" stroke-width="4"/>
<polygon points="90,55 82,70 98,70" fill="#173b68"/>
<!-- rectangle and triangle -->
<polygon points="90,285 585,285 585,410 90,410" fill="#8fd3ff" stroke="#2878b5" stroke-width="2"/>
<polygon points="90,285 585,110 585,285" fill="#ffc966" stroke="#d89519" stroke-width="2"/>
<!-- motion line -->
<line x1="90" y1="285" x2="585" y2="110" stroke="#e53935" stroke-width="5"/>
<!-- guides -->
<line x1="90" y1="285" x2="585" y2="285" stroke="#333" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="585" y1="110" x2="585" y2="410" stroke="#333" stroke-width="2" stroke-dasharray="9 7"/>
<!-- points -->
<circle cx="90" cy="410" r="6" fill="#173b68"/><circle cx="90" cy="285" r="7" fill="#173b68"/>
<circle cx="585" cy="110" r="7" fill="#173b68"/><circle cx="585" cy="285" r="7" fill="#173b68"/>
<!-- labels -->
<g font-family="Georgia, 'Times New Roman', serif" fill="#111">
<text x="74" y="435" font-size="24">O</text>
<text x="72" y="280" font-size="24">A</text>
<text x="600" y="105" font-size="24">B</text>
<text x="600" y="290" font-size="24">C</text>
<text x="600" y="435" font-size="24">D</text>
<text x="66" y="294" font-size="28" font-style="italic">u</text>
<text x="66" y="118" font-size="28" font-style="italic">v</text>
<text x="574" y="438" font-size="28" font-style="italic">t</text>
<text x="345" y="475" font-size="25">Time, <tspan font-style="italic">t</tspan> (s)</text>
<text transform="translate(28 320) rotate(-90)" font-size="25">Velocity, <tspan font-style="italic">v</tspan> (m s⁻¹)</text>
<!-- math labels -->
<text x="285" y="355" font-size="28" font-style="italic">Area = ut</text>
<text x="245" y="215" font-size="25">Area = ½t(v − u)</text>
</g>
</svg>