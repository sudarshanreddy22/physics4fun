<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Top View Magnetic Compass</title>
  <desc id="desc">A colourful top-view magnetic compass with metallic rim, compass rose, north-south needle and cardinal directions.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cfe8ef" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="rimOuter" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff7c8"/>
      <stop offset="25%" stop-color="#ffd76c"/>
      <stop offset="55%" stop-color="#d79a21"/>
      <stop offset="82%" stop-color="#8b5e0d"/>
      <stop offset="100%" stop-color="#f5cb59"/>
    </radialGradient>

    <radialGradient id="rimInner" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fdfbf4"/>
      <stop offset="100%" stop-color="#eadfca"/>
    </radialGradient>

    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="needleNorth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c91e35"/>
      <stop offset="55%" stop-color="#ff4f65"/>
      <stop offset="100%" stop-color="#ffd1d7"/>
    </linearGradient>

    <linearGradient id="needleSouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f5ff"/>
      <stop offset="48%" stop-color="#1d97e6"/>
      <stop offset="100%" stop-color="#0a4f9a"/>
    </linearGradient>

    <radialGradient id="pivot" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff4b4"/>
      <stop offset="55%" stop-color="#dca52a"/>
      <stop offset="100%" stop-color="#8b5b12"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#274755" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="228" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)">
    <circle cx="250" cy="250" r="200" fill="url(#rimOuter)"/>
    <circle cx="250" cy="250" r="183" fill="#3f5561" opacity="0.22"/>
    <circle cx="250" cy="250" r="172" fill="url(#rimInner)"/>
    <circle cx="250" cy="250" r="166" fill="none" stroke="#c7bca6" stroke-width="2"/>
  </g>

  <!-- degree ring -->
  <g stroke="#2c3740" stroke-linecap="round" transform="translate(250 250)">
    <!-- major and minor ticks generated manually at 10 degree increments -->
    <g id="tickSet">
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(10)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(20)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(30)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(40)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(50)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(60)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(70)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(80)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(90)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(100)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(110)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(120)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(130)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(140)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(150)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(160)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(170)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(180)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(190)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(200)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(210)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(220)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(230)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(240)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(250)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(260)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(270)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(280)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(290)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(300)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(310)"/>
      <line x1="0" y1="-145" x2="0" y2="-162" stroke-width="2.6" transform="rotate(320)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(330)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(340)"/>
      <line x1="0" y1="-149" x2="0" y2="-162" stroke-width="1.2" transform="rotate(350)"/>
    </g>
  </g>

  <!-- degree numbers -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#28323a" text-anchor="middle">
    <text x="250" y="92">0</text>
    <text x="331" y="113">30</text>
    <text x="390" y="171">60</text>
    <text x="412" y="255">90</text>
    <text x="390" y="340">120</text>
    <text x="331" y="397">150</text>
    <text x="250" y="420">180</text>
    <text x="169" y="397">210</text>
    <text x="110" y="340">240</text>
    <text x="88" y="255">270</text>
    <text x="110" y="171">300</text>
    <text x="169" y="113">330</text>
  </g>

  <!-- cardinal letters -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#1d2730" text-anchor="middle">
    <text x="250" y="145" font-size="48" fill="#c1252c">N</text>
    <text x="250" y="385" font-size="48" fill="#0e5aa6">S</text>
    <text x="132" y="268" font-size="44">W</text>
    <text x="367" y="268" font-size="44">E</text>
    <text x="185" y="185" font-size="26">NW</text>
    <text x="317" y="185" font-size="26">NE</text>
    <text x="183" y="338" font-size="26">SW</text>
    <text x="318" y="338" font-size="26">SE</text>
  </g>

  <!-- compass rose -->
  <g transform="translate(250 250)">
    <g fill="#181c22" opacity="0.92">
      <polygon points="0,-92 12,0 0,92 -12,0"/>
      <polygon points="92,0 0,12 -92,0 0,-12"/>
    </g>
    <g fill="#373d45" opacity="0.80">
      <polygon points="65,-65 9,0 65,65 0,9" transform="rotate(45)"/>
      <polygon points="65,-65 9,0 65,65 0,9" transform="rotate(135)"/>
      <polygon points="65,-65 9,0 65,65 0,9" transform="rotate(225)"/>
      <polygon points="65,-65 9,0 65,65 0,9" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#9f9688" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- needle -->
  <g transform="translate(250 250)">
    <polygon points="0,-108 22,0 0,-14 -22,0" fill="url(#needleNorth)" stroke="#a41c2d" stroke-width="1.5"/>
    <polygon points="0,108 22,0 0,14 -22,0" fill="url(#needleSouth)" stroke="#114d8d" stroke-width="1.5"/>
    <polygon points="0,-96 8,-14 0,-25 -8,-14" fill="#ffe2e4" opacity="0.58"/>
    <polygon points="0,96 8,14 0,25 -8,14" fill="#e3f8ff" opacity="0.42"/>
    <circle cx="0" cy="0" r="17" fill="url(#pivot)" stroke="#84570f" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#f8dea0" opacity="0.75"/>
  </g>

  <!-- subtle highlights -->
  <path d="M130 125 C165 95, 210 78, 262 78 C312 78, 356 93, 388 120 C333 107, 286 101, 244 102 C195 103, 156 110, 130 125Z"
        fill="url(#glassShine)" opacity="0.85"/>
  <circle cx="250" cy="250" r="171" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
</svg>
