<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Battle Live Quiz Dashboard</title>
<style>
:root{--bg:#f4f7fb;--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#dbeafe;--pink:#db2777;--pink2:#fce7f3;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--line:#d8e0ea;--navy:#0b1020;--card:#ffffff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);font-family:Aptos,Segoe UI,Arial,sans-serif;color:var(--ink);overflow:hidden}
button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.top{height:82px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;position:relative;z-index:5}
.iconBtn{width:46px;height:46px;border-radius:12px;background:#1e293b;color:#fff;font-size:25px;display:grid;place-items:center;flex:0 0 auto}.iconBtn:hover{background:#334155}
.round{font-weight:800;font-size:17px;min-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turnBadge{font-size:18px;font-weight:1000;padding:9px 16px;border-radius:999px;border:2px solid transparent;white-space:nowrap}.turnBadge.boysTurn{background:#dbeafe;color:#1e3a8a;border-color:#60a5fa}.turnBadge.girlsTurn{background:#fce7f3;color:#831843;border-color:#f472b6}
.score{display:flex;gap:9px;margin-left:auto}.scoreBox{min-width:130px;border-radius:13px;padding:8px 12px;font-weight:1000;font-size:21px;text-align:center;border:3px solid transparent;transition:.2s ease;opacity:.70}.scoreBox.boys{background:#1e3a8a}.scoreBox.girls{background:#831843}.scoreBox.active{opacity:1;transform:scale(1.05);box-shadow:0 0 0 4px rgba(255,255,255,.28);animation:activePulse 1.25s infinite}@keyframes activePulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,.08)}}
.timerWrap{display:flex;align-items:center;gap:11px;margin-left:8px;min-width:154px;justify-content:flex-end}.timer{font-size:64px;font-weight:1000;color:#fcd34d;line-height:.9;letter-spacing:-2px}.timer.low{color:#fb7185}
.clockIcon{width:48px;height:48px;border-radius:50%;border:5px solid #e2e8f0;position:relative;flex:0 0 auto;animation:pulseClock 1s infinite}.clockIcon:before{content:'';position:absolute;left:50%;top:50%;width:4px;height:16px;background:#fcd34d;border-radius:4px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);animation:spinHand 4s linear infinite}.clockIcon:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;background:#fcd34d;border-radius:50%;transform:translate(-50%,-50%)}@keyframes spinHand{to{transform:translate(-50%,-100%) rotate(360deg)}}@keyframes pulseClock{50%{border-color:#94a3b8}}
.bar{height:7px;background:#e5e7eb}.bar>div{height:7px;background:linear-gradient(90deg,#16a34a,#f59e0b,#dc2626);width:100%;transition:width 1s linear}
.main{height:calc(100vh - 166px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.75fr);gap:18px;padding:20px 22px}.qPanel,.side{background:#fff;border:1px solid var(--line);border-radius:20px}.qPanel{padding:24px 28px;display:flex;flex-direction:column;min-width:0}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.pill{border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}.phy{background:#dbeafe;color:#1e3a8a}.chem{background:#f3e8ff;color:#581c87}.bio{background:#dcfce7;color:#166534}.pts{background:#fef3c7;color:#78350f}.turnPill{background:#e2e8f0;color:#0f172a}.q{font-size:clamp(30px,3.2vw,46px);line-height:1.16;font-weight:900;margin:auto 0;letter-spacing:-.5px}.answer{display:none;margin-top:20px;border:3px solid #22c55e;background:#ecfdf5;border-radius:16px;padding:16px 18px;color:#14532d;font-size:clamp(23px,2vw,30px);font-weight:900}.side{padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.side img{max-width:100%;max-height:54vh;border-radius:14px;object-fit:contain}.symbol{font-size:86px}.side h2{margin:5px 0 0;color:#475569}.controls{height:77px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:10px 16px;position:relative;z-index:6}.controls button{border-radius:12px;padding:12px 15px;font-size:16px;font-weight:900;white-space:nowrap}.correct{background:#dcfce7;color:#166534}.wrong{background:#fee2e2;color:#991b1b}.primary{background:#fef3c7;color:#78350f}.nav{background:#e2e8f0;color:#0f172a}.scoresBtn{background:#e0f2fe;color:#0c4a6e}.switchBtn{background:#ede9fe;color:#4c1d95}.danger{background:#fff1f2;color:#9f1239}.spacer{flex:1}
.scoreScreen{height:100vh;background:#0b1020;color:#fff;padding:24px;overflow:auto}.scoreTop{display:flex;align-items:center;gap:12px;margin-bottom:22px}.scoreTop h1{font-size:42px;margin:0}.scoreTop .backBtn{margin-left:auto}.backBtn,.nextRoundBtn{border-radius:12px;padding:12px 18px;font-size:17px;font-weight:900}.backBtn{background:#e2e8f0;color:#0f172a}.nextRoundBtn{background:#fde68a;color:#78350f}.bigScores{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:850px;margin:0 auto 26px}.bigCard{border-radius:22px;padding:24px;text-align:center}.bigCard.boys{background:#1e3a8a}.bigCard.girls{background:#831843}.bigCard .label{font-size:23px;font-weight:900}.bigCard .num{font-size:78px;font-weight:1000;line-height:1.05}.bigCard .roundDelta{font-size:18px;opacity:.9}.scoreTable{max-width:850px;margin:0 auto;background:#111827;border-radius:18px;overflow:hidden;border:1px solid #334155}.scoreRow{display:grid;grid-template-columns:1.5fr 1fr 1fr;border-top:1px solid #334155}.scoreRow:first-child{border-top:0}.scoreRow>div{padding:12px 16px;font-weight:800}.scoreRow.header{background:#1e293b;color:#cbd5e1}.scoreRow .b{text-align:center;color:#93c5fd}.scoreRow .g{text-align:center;color:#f9a8d4}.adjuster{max-width:850px;margin:20px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.adjuster button{padding:10px 14px;border-radius:10px;font-weight:900}.ab{background:#dbeafe;color:#1e3a8a}.ag{background:#fce7f3;color:#831843}
.statusStrip{position:absolute;left:50%;top:82px;transform:translateX(-50%);z-index:8;background:#0f172a;color:#fff;border-radius:0 0 12px 12px;padding:5px 15px;font-size:13px;font-weight:800;opacity:.92}.timeup{animation:screenFlash .7s 4}@keyframes screenFlash{50%{background:#fee2e2}}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:999px;font-weight:900;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media(max-width:900px){.round{min-width:140px}.turnBadge{display:none}.scoreBox{min-width:90px;font-size:17px}.timer{font-size:48px}.clockIcon{width:38px;height:38px}.main{grid-template-columns:1fr}.side{display:none}.controls{overflow-x:auto}.q{font-size:32px}.scoreTop h1{font-size:30px}.bigCard .num{font-size:58px}}

.introScreen,.winnerScreen{min-height:100vh;background:linear-gradient(145deg,#07101f,#111c33);color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto}
.introCard{width:min(980px,96vw);background:#fff;color:#0f172a;border-radius:26px;padding:30px 34px;box-shadow:0 24px 80px rgba(0,0,0,.30);position:relative}
.introTools{position:absolute;left:18px;top:18px;display:flex;gap:8px}.introTools .iconBtn{background:#e2e8f0;color:#0f172a}.introTitle{text-align:center;font-size:clamp(34px,5vw,58px);font-weight:1000;letter-spacing:-1.5px;margin:14px 0 6px}.introSub{text-align:center;color:#475569;font-size:19px;font-weight:800;margin-bottom:24px}.instructions{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;background:#f8fafc;border:1px solid #dbe3ed;border-radius:18px;padding:20px 24px;margin:0 auto 22px}.inst{display:flex;gap:11px;align-items:flex-start;font-size:16px;line-height:1.38;font-weight:700;color:#334155}.instNo{width:30px;height:30px;border-radius:50%;background:#0f172a;color:white;display:grid;place-items:center;flex:0 0 auto;font-size:14px}.startBtn{display:block;margin:4px auto 0;padding:17px 34px;border-radius:16px;background:#16a34a;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 8px 0 #166534}.startBtn:active{transform:translateY(3px);box-shadow:0 5px 0 #166534}.formatLine{text-align:center;margin-top:15px;color:#64748b;font-weight:800}
.winnerWrap{width:min(1020px,96vw);text-align:center}.trophy{font-size:92px;line-height:1}.winnerKicker{font-size:20px;font-weight:900;color:#fcd34d;letter-spacing:2px}.winnerTitle{font-size:clamp(44px,7vw,82px);font-weight:1000;margin:4px 0 8px;letter-spacing:-2px}.winnerMsg{font-size:23px;color:#cbd5e1;font-weight:800;margin-bottom:20px}.winnerScores{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:720px;margin:0 auto 24px}.winnerCard{border-radius:22px;padding:22px;border:3px solid rgba(255,255,255,.15)}.winnerCard.boys{background:#1e3a8a}.winnerCard.girls{background:#831843}.winnerCard .name{font-size:23px;font-weight:900}.winnerCard .value{font-size:76px;font-weight:1000;line-height:1}.winnerCard.win{outline:5px solid #fcd34d;transform:scale(1.04)}.winnerActions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.winnerActions button{padding:14px 20px;border-radius:13px;font-size:18px;font-weight:1000}.restartBtn{background:#fde68a;color:#713f12}.winnerScoreBtn{background:#e0f2fe;color:#0c4a6e}
@media(max-width:720px){.instructions{grid-template-columns:1fr}.introCard{padding:66px 20px 24px}.winnerScores{grid-template-columns:1fr}.winnerCard .value{font-size:58px}}
</style></head><body>
<div id="app"></div>
<script>
const rounds=[{"name":"Round 1","title":"Precision Rapid Fire","rule":"One question per turn. Correct +5. Wrong or time-up -5 for the attempting team. Answer appears only when the Quiz Master clicks Reveal Answer.","qs":[{"cat":"Physics","pts":5,"t":40,"q":"Two identical conducting spheres carry charges +8 units and -2 units. They are touched together and then separated. What charge will each sphere have?","a":"+3 units on each sphere. Total charge is +6 units and identical spheres share it equally.","img":null},{"cat":"Physics","pts":5,"t":40,"q":"A student walks 10 m north, 6 m south and then 8 m east. Find the total distance and the magnitude of displacement.","a":"Distance = 24 m. Net displacement is 4 m north and 8 m east, so magnitude = sqrt(4^2 + 8^2) = sqrt(80) ≈ 8.9 m.","img":null},{"cat":"Chemistry","pts":5,"t":40,"q":"It is known that 12 g of carbon reacts completely with 32 g of oxygen to form carbon dioxide. If 12 g carbon is burnt in 40 g oxygen, what masses of carbon dioxide and unused oxygen remain?","a":"44 g carbon dioxide forms and 8 g oxygen remains unused.","img":null},{"cat":"Chemistry","pts":5,"t":40,"q":"Element X has electron arrangement 2,8,2 and element Y has 2,8,7. What is the simplest formula of the compound expected between X and Y?","a":"XY2. X tends to form X2+ and each Y tends to form Y-, so two Y ions are needed for charge balance.","img":null},{"cat":"Biology","pts":5,"t":40,"q":"During vigorous exercise, pulse rate rises quickly even though the number of red blood cells does not suddenly increase. Why is a faster pulse useful?","a":"It increases blood flow, delivering oxygen and glucose faster to muscles and removing carbon dioxide and other wastes more quickly.","img":null},{"cat":"Biology","pts":5,"t":40,"q":"Two identical well-watered plants are kept at the same temperature and light. One is in very humid air and the other in dry air. Which plant loses water faster, and why?","a":"The plant in dry air loses water faster because the water-vapour concentration gradient between the leaf and surrounding air is greater.","img":null}]},{"name":"Round 2","title":"Visual Mystery","rule":"Study the visual carefully. Correct +6. Wrong or time-up -6. A scientific explanation is compulsory.","qs":[{"cat":"Physics","pts":6,"t":45,"q":"The circuit image shows identical bulbs connected in one continuous path. If the switch is closed and the filament of any one bulb breaks, what happens to the remaining bulbs? Explain.","a":"All bulbs go off because the broken filament opens the single series path, so current cannot flow anywhere in the circuit.","img":"circuit"},{"cat":"Physics","pts":6,"t":45,"q":"The pencil appears displaced at the water surface. If water were replaced by a transparent liquid with a greater refractive index, would the apparent upward shift generally increase or decrease?","a":"It would generally increase because stronger refraction makes the apparent depth smaller compared with the real depth.","img":"refraction"},{"cat":"Chemistry","pts":6,"t":45,"q":"The indicator image shows a solution that turns red litmus blue. Acid is then added drop by drop until neither red nor blue litmus changes colour. What chemical process has occurred?","a":"Neutralisation. Acid has reacted with the base until the mixture is approximately neutral, producing salt and water.","img":"litmus"},{"cat":"Chemistry","pts":6,"t":45,"q":"A colourless solution leaves both red and blue litmus unchanged. Why is it scientifically incorrect to identify it as pure water from this test alone?","a":"Litmus only shows that the solution is approximately neutral. Many neutral solutions contain dissolved substances, so unchanged litmus does not prove purity.","img":"litmus"},{"cat":"Biology","pts":6,"t":45,"q":"The alveoli are surrounded by dense capillary networks. Besides supplying blood, how does continuous blood flow help oxygen diffuse rapidly from alveoli into blood?","a":"It carries oxygenated blood away and brings deoxygenated blood in, maintaining a steep oxygen concentration gradient for diffusion.","img":"lungs"},{"cat":"Biology","pts":6,"t":45,"q":"In the stomata image, suppose guard cells lose solutes and then water. Predict what happens to the pore and explain the cell-level reason.","a":"The pore closes because guard cells lose water, become less turgid/flaccid, and can no longer hold the stomatal opening wide.","img":"stomata"}]},{"name":"Round 3","title":"Science Detective","rule":"Identify the concept from all clues. Correct +7. Wrong or time-up -7.","qs":[{"cat":"Physics","pts":7,"t":45,"q":"I can be present even when an object's speed is constant. I measure how quickly velocity changes, and circular motion cannot occur without me. What am I?","a":"Acceleration. In circular motion the direction of velocity changes continuously even if speed is constant.","img":null},{"cat":"Physics","pts":7,"t":45,"q":"I oppose relative motion between surfaces, waste energy as heat in machines, yet without me walking and braking would be impossible. What am I?","a":"Friction.","img":null},{"cat":"Chemistry","pts":7,"t":45,"q":"My atoms belong to the same element and therefore have the same number of protons, but they do not all have the same number of neutrons. What am I describing?","a":"Isotopes of an element.","img":null},{"cat":"Chemistry","pts":7,"t":45,"q":"I separate two or more miscible liquids by using their different boiling points and repeated vaporisation-condensation in a column. What method am I?","a":"Fractional distillation.","img":null},{"cat":"Biology","pts":7,"t":45,"q":"I am not made of cells, I reproduce only inside living host cells, and medicines that kill bacteria usually do not kill me. What am I?","a":"A virus.","img":null},{"cat":"Biology","pts":7,"t":45,"q":"I line the small intestine as millions of finger-like projections. I contain blood capillaries and lacteals and make absorption extremely efficient. What am I?","a":"Intestinal villi.","img":null}]},{"name":"Round 4","title":"Predict the Experiment","rule":"Predict the observation first, then explain it. Correct +8. Wrong or time-up -8.","qs":[{"cat":"Physics","pts":8,"t":50,"q":"Two light paper strips hang vertically and parallel, a few centimetres apart. Air is blown rapidly through the gap between them. Predict their motion.","a":"The strips move toward each other. Faster air between them has lower pressure, while the higher pressure outside pushes them inward.","img":null},{"cat":"Physics","pts":8,"t":50,"q":"A bar magnet is cut into two equal pieces. Each piece is tested using a compass. Predict what poles each piece will show.","a":"Each piece becomes a smaller magnet with both a north and a south pole; an isolated single magnetic pole is not produced.","img":null},{"cat":"Chemistry","pts":8,"t":50,"q":"A few crystals of potassium permanganate are placed gently at the bottom of still water without stirring. What happens to the colour after a long time, and why?","a":"The purple colour gradually spreads throughout the water because particles diffuse from higher to lower concentration due to continuous random motion.","img":null},{"cat":"Chemistry","pts":8,"t":50,"q":"A burning magnesium ribbon is placed in a closed jar containing only a limited amount of air. Predict why the bright burning eventually stops even if some magnesium remains.","a":"The available oxygen is consumed. Once oxygen becomes insufficient to support combustion, burning stops although unreacted magnesium may remain.","img":null},{"cat":"Biology","pts":8,"t":50,"q":"Dry raisins are first soaked in plain water and later transferred to a concentrated sugar solution. Predict the size change in each step and name the process.","a":"They swell in plain water and shrink in concentrated sugar solution because water enters and then leaves the cells by osmosis.","img":null},{"cat":"Biology","pts":8,"t":50,"q":"A destarched variegated leaf is exposed to sunlight and then tested with iodine. Which regions turn blue-black, and what two requirements for starch formation does this demonstrate?","a":"Only green regions that received light turn blue-black. The test demonstrates that both chlorophyll and light are required for photosynthetic starch formation.","img":"photo"}]},{"name":"Round 5","title":"Science Auction","rule":"Every question requires calculation or layered reasoning. Correct +9. Wrong or time-up -9.","qs":[{"cat":"Physics","pts":9,"t":55,"q":"Cyclist A covers an entire 1200 m route at 6 m/s. Cyclist B covers the first 600 m at 4 m/s and the next 600 m at 12 m/s. Who finishes first?","a":"They finish together. A takes 1200/6 = 200 s. B takes 600/4 + 600/12 = 150 + 50 = 200 s.","img":null},{"cat":"Physics","pts":9,"t":55,"q":"Object P has mass 2 kg and speed 3 m/s. Object Q has mass 0.5 kg and speed 6 m/s. Compare their kinetic energies.","a":"They have equal kinetic energy: P = 1/2 x 2 x 3^2 = 9 J; Q = 1/2 x 0.5 x 6^2 = 9 J.","img":null},{"cat":"Chemistry","pts":9,"t":55,"q":"A solution contains 25 g salt dissolved in 75 g water. Then 20 g of water evaporates without losing salt. What is the new mass percentage of salt in the solution?","a":"31.25%. Final solution mass = 25 + 55 = 80 g, so salt percentage = 25/80 x 100 = 31.25%.","img":null},{"cat":"Chemistry","pts":9,"t":55,"q":"A neutral atom has 15 protons, 16 neutrons and 15 electrons. It gains 3 electrons. State its mass number, number of electrons, and ionic charge.","a":"Mass number = 31; electrons = 18; ionic charge = 3-.","img":null},{"cat":"Biology","pts":9,"t":55,"q":"A narrow ring of bark containing phloem is removed from a tree trunk without seriously damaging xylem. After several weeks, where would sugars tend to accumulate, and why?","a":"Sugars accumulate above the removed ring because downward translocation through phloem is interrupted while xylem water transport can continue for some time.","img":null},{"cat":"Biology","pts":9,"t":55,"q":"During dialysis, the dialysis fluid contains normal concentrations of useful salts and glucose but initially contains no urea. Why is this composition important?","a":"It prevents excessive loss of useful substances while maintaining a concentration gradient that allows urea and other wastes to diffuse out of the blood.","img":null}]},{"name":"Round 6","title":"Challenge the Opponent","rule":"Choose the opponent before the question appears. Correct +10. Wrong or time-up -10.","qs":[{"cat":"Physics","pts":10,"t":55,"q":"A train starts from rest and accelerates uniformly at 2 m/s^2 for 5 s. It then continues at the reached speed for 10 s. What total distance does it travel?","a":"125 m. During acceleration: s = 1/2 x 2 x 5^2 = 25 m; final speed = 10 m/s. Constant-speed distance = 10 x 10 = 100 m. Total = 125 m.","img":null},{"cat":"Physics","pts":10,"t":55,"q":"A block of density 800 kg/m^3 floats freely in water of density 1000 kg/m^3. What fraction of its volume is submerged?","a":"0.80, or 80%. For a floating object, submerged fraction = object density / liquid density = 800/1000.","img":null},{"cat":"Chemistry","pts":10,"t":55,"q":"Using H=1, S=32 and O=16, calculate the relative molecular mass of H2SO4 and the total number of atoms present in one molecule.","a":"Relative molecular mass = 2(1) + 32 + 4(16) = 98; one molecule contains 7 atoms in total.","img":null},{"cat":"Chemistry","pts":10,"t":55,"q":"A compound always contains nitrogen and oxygen in the mass ratio 7:16. If a pure sample contains 7.0 g nitrogen, what mass of oxygen must it contain, and which law does this illustrate?","a":"16.0 g oxygen; it illustrates the law of constant (definite) proportions.","img":null},{"cat":"Biology","pts":10,"t":55,"q":"A person's bile duct becomes blocked, but pancreatic enzymes are still produced normally. Which nutrient's digestion is most strongly affected and why?","a":"Fat digestion is strongly affected because bile normally emulsifies fat into small droplets, increasing surface area for lipase action.","img":null},{"cat":"Biology","pts":10,"t":55,"q":"A disease flattens many villi in the small intestine while digestive enzymes remain normal. Why can the patient still become malnourished despite food being digested?","a":"The greatly reduced absorptive surface means digested nutrients cannot enter blood and lymph efficiently.","img":null}]},{"name":"Round 7","title":"Hard Sprint","rule":"Only 30 seconds. Give one precise answer. Correct +6. Wrong or time-up -6.","qs":[{"cat":"Physics","pts":6,"t":30,"q":"A car moves at 72 km/h for 15 s. How far does it travel?","a":"300 m. 72 km/h = 20 m/s, so distance = 20 x 15 = 300 m.","img":null},{"cat":"Physics","pts":6,"t":30,"q":"A tuning fork vibrates at 250 Hz. What is the time period of one vibration?","a":"0.004 s (4 ms), because period = 1/frequency = 1/250.","img":null},{"cat":"Chemistry","pts":6,"t":30,"q":"Element X has atomic number 13. If oxygen has valency 2, what is the simplest formula of the oxide formed by X?","a":"X2O3. X has arrangement 2,8,3 and valency 3, so charges balance in a 2:3 ratio.","img":null},{"cat":"Chemistry","pts":6,"t":30,"q":"For the reaction 2H2 + O2 -> 2H2O, a container initially has 4 molecules of H2 and 3 molecules of O2. After complete reaction, how many H2O molecules form and what remains?","a":"4 H2O molecules form and 1 O2 molecule remains; all 4 H2 molecules are consumed.","img":null},{"cat":"Biology","pts":6,"t":30,"q":"Why do antibiotics that act on bacterial cell walls or bacterial ribosomes fail to cure influenza?","a":"Influenza is caused by a virus, which lacks bacterial cell walls and ribosomes and replicates using host-cell machinery.","img":null},{"cat":"Biology","pts":6,"t":30,"q":"Why can a vaccinated person's immune response be much faster during a later encounter with the same pathogen?","a":"Memory cells formed after the first exposure recognise the antigen and rapidly produce a stronger specific immune response.","img":null}]},{"name":"Round 8","title":"Grand Finale","rule":"The hardest questions. Correct +15. Wrong or time-up -15. The final score decides the winner.","qs":[{"cat":"Physics","pts":15,"t":60,"q":"A stone moves in a horizontal circle on a string. At one instant the string suddenly breaks. Ignoring air resistance for the immediate motion, in what direction does the stone move and why?","a":"It moves along the tangent to the circle at the breaking point because its inertia carries it in the direction of its instantaneous velocity when the centripetal force disappears.","img":null},{"cat":"Physics","pts":15,"t":60,"q":"An ice cube floats in a glass filled almost to the brim with water. When the ice melts completely, does the water level rise, fall, or remain essentially unchanged? Explain.","a":"It remains essentially unchanged. While floating, the ice already displaces a mass of water equal to its own mass; when melted, it becomes exactly that mass of water.","img":null},{"cat":"Chemistry","pts":15,"t":60,"q":"A mixture of iron powder and sulfur can be partly separated with a magnet. After the mixture is strongly heated until a new solid forms, the magnet no longer separates the iron in the same way. What changed?","a":"A chemical reaction formed iron sulfide, a new compound with properties different from the original iron and sulfur; the iron is no longer present as free iron particles.","img":null},{"cat":"Chemistry","pts":15,"t":60,"q":"A hot saturated solution of a solid salt is allowed to cool undisturbed and crystals appear. Explain why crystals form while some salt still remains dissolved in the liquid.","a":"The salt is less soluble at the lower temperature, so excess dissolved solute crystallises until the remaining solution becomes saturated at the new temperature.","img":null},{"cat":"Biology","pts":15,"t":60,"q":"A well-watered potted plant is kept with its roots continuously waterlogged. After several days it begins to wilt. Explain how too much water around roots can indirectly reduce water uptake.","a":"Waterlogging removes air spaces and causes oxygen shortage in roots. Reduced aerobic respiration limits energy-dependent ion uptake and normal root function, so water absorption can fall and the plant may wilt.","img":null},{"cat":"Biology","pts":15,"t":60,"q":"A person has normal lungs and normal breathing movements but very low haemoglobin. Why can the person still become tired quickly during exercise?","a":"Haemoglobin carries most oxygen in blood. With little haemoglobin, oxygen transport to working muscles is reduced even if ventilation is normal, limiting aerobic respiration and energy release.","img":null}]}]; const images={"circuit":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAH7A4QDASIAAhEBAxEB/8QAHQABAAEFAQEBAAAAAAAAAAAAAAECAwYHCAUECf/EAGMQAAEDAgIEBgkMDQkGBAcBAQABAgMEBQYRBxIhMQhBUXGU0RMYIjJWYYGR0hQWFzNCUnOSobGysxUjNTZGU1ViZnJ0dcEkJjdDRWOChJUnNGR2ouJEVGWDJYWTo9Ph8MLx/8QAGwEBAAIDAQEAAAAAAAAAAAAAAAEEAgMFBgf/xAA8EQEAAQICBQcLBAIDAAMAAAAAAQIDBBEFEiExUQZBUoGR0fATFBUWMjNhcaGisSI1gsEjQpLh8SVy0v/aAAwDAQACEQMRAD8A6oAAAAbwHEAAAAAAABuAAAZgAAAAAAADIAFUAAAAAAAAAAAAAAADMAAAAACAAAAAA3gB5QMwAAAAZgAAAAAAABAAAGYDMAAAAAG4AAAAAAAAnIgAAAAAAAABmAAAAADMAAAAAAAZgAAAAAAAAAABuADeAACgbgAA8gABQAAzAAZgAAAAAAAAAACdoAjjAAAAAAoAAcQAAAZAAAgDaNoAAAAAAAAADiAADcAAAUZAAAAAHkG4AAEAAAAAgAAbwAAGwAAAAAABQN4AAAAgABQAAAAAAAFAADIcYAAAAN4JIVUQAeNirGNjwXbVuF8r46SFV1WIu18rvesam1y+JDANIWnahsVRJZcLQsvl6z1HOYqrT0zuR7k7535jfKqGrp6RZqx2IcfXJ9xuT0zjgVfa096jU2Mb4k8qlO/i6beynbL0miuTt7F5XLudNE7uM/KP73NlU/CYw1JV9jqLLfqamVdlS6FjkROVWNcrkTyKbSs96t2ILdDcrVWQ1lHO3Wjmidm1yfwXlRdqHHuK8RJeaxJ4aeGlYxEaxsTUbkibtxmXB9xbPbMZMs/ZcqC9tkzhz7mOqjbrI9OTWajkXlVEK2G0hNdzUq53c05yQow2E85sZxMRnMTOez5unVAzzQHVfPwAAAAAzAAAAAMxmAAG4AAMgAAA4wAAAAAAFHGAA3jcAAAAAAAAOIAAAAAAAAAAoADjAAAAAAAAAAAAAAAAAAAAAAAAAADIAAAAAAAAAAAAAAAAAAAN4ADMAAAAAAAAAAAAAAAAA let r=0,q=0,boys=0,girls=0,revealed=false,sec=0,maxSec=0,timer=null,mode='intro',returnMode='question',winnerSoundPlayed=false;
const turnOverrides={}, qState={}, scoreLog=[];
let audioCtx=null, muted=false;
function current(){return rounds[r].qs[q]}
function qKey(){return r+'-'+q}
function state(){if(!qState[qKey()]) qState[qKey()]={penalized:false,awarded:false,timedOut:false}; return qState[qKey()]}
function globalIndex(){let n=0;for(let i=0;i<r;i++)n+=rounds[i].qs.length;return n+q}
function activeTeam(){return turnOverrides[qKey()] || (globalIndex()%2===0?'boys':'girls')}
function otherTeam(t){return t==='boys'?'girls':'boys'}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
document.addEventListener('pointerdown',ensureAudio,{once:true});
function beep(freq=700,dur=.18,vol=.17,type='sine',delay=0){if(muted)return;ensureAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.02)}
function playWarning(){beep(520,.22,.20,'square',0);beep(420,.24,.20,'square',.28);beep(320,.35,.22,'square',.58)}
function noiseBurst(delay,dur=.075,vol=.10){if(muted)return;ensureAudio();if(!audioCtx)return;const sr=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,Math.max(1,Math.floor(sr*dur)),sr),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;f.type='bandpass';f.frequency.value=1500+Math.random()*1100;f.Q.value=.7;g.gain.value=vol;src.connect(f).connect(g).connect(audioCtx.destination);src.start(audioCtx.currentTime+delay)}
function playClap(){if(muted)return;ensureAudio();for(let i=0;i<14;i++)noiseBurst(i*.055+Math.random()*.03,.06+.04*Math.random(),.07+.05*Math.random());beep(880,.12,.08,'triangle',.08);beep(1170,.16,.06,'triangle',.22)}
function playWrong(){beep(180,.35,.16,'sawtooth',0)}
function toggleMute(){muted=!muted;showToast(muted?'Sounds muted':'Sounds on');render(false)}
function showToast(msg){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1700)}
function logScore(team,delta,reason){if(team==='boys')boys+=delta;else girls+=delta;scoreLog.push({round:r,team,delta,reason,question:q});}
function applyPenalty(reason='wrong'){const st=state();if(st.penalized||st.awarded)return;const team=activeTeam(),pts=current().pts;logScore(team,-pts,reason);st.penalized=true;if(reason==='time'){st.timedOut=true;playWarning();showToast(cap(team)+' -'+pts+' (time up)')}else{playWrong();showToast(cap(team)+' -'+pts)};render(false)}
function awardCorrect(){const st=state(),team=activeTeam(),pts=current().pts;if(st.awarded){showToast('Score already awarded');return}if(st.penalized){showToast('Already penalized - adjust from Scores if needed');return}logScore(team,pts,'correct');st.awarded=true;playClap();showToast(cap(team)+' +'+pts);render(false)}
function manualAdjust(team,delta){logScore(team,delta,'manual');showToast(cap(team)+' '+(delta>0?'+':'')+delta);render(false)}
function startTimer(){clearInterval(timer);sec=current().t;maxSec=sec;document.body.classList.remove('timeup');timer=setInterval(()=>{sec--;if(sec<=0){sec=0;clearInterval(timer);document.body.classList.add('timeup');applyPenalty('time');setTimeout(()=>document.body.classList.remove('timeup'),2800)}render(false)},1000)}
function pct(){return maxSec?Math.max(0,sec/maxSec*100):0}
function catClass(c){return c==='Physics'?'phy':c==='Chemistry'?'chem':'bio'}
function roundTotals(idx){let b=0,g=0;for(const e of scoreLog){if(e.round===idx){if(e.team==='boys')b+=e.delta;else g+=e.delta}}return{boys:b,girls:g}}
function scoreRows(){let html='<div class="scoreRow header"><div>ROUND</div><div class="b">BOYS</div><div class="g">GIRLS</div></div>';const upto=mode==='winner'?rounds.length-1:r;for(let i=0;i<=upto;i++){const t=roundTotals(i);html+='<div class="scoreRow"><div>'+rounds[i].name+' - '+rounds[i].title+'</div><div class="b">'+(t.boys>=0?'+':'')+t.boys+'</div><div class="g">'+(t.girls>=0?'+':'')+t.girls+'</div></div>'}return html}
function renderIntro(){clearInterval(timer);document.getElementById('app').innerHTML='<div class="introScreen"><div class="introCard"><div class="introTools"><button class="iconBtn" onclick="toggleFullscreen()" title="Full screen">⛶</button><button class="iconBtn" onclick="toggleMute()" title="Sound on/off">'+(muted?'🔇':'🔊')+'</button></div><div class="introTitle">SCIENCE BATTLE</div><div class="introSub">Boys vs Girls • Classes 6-9 • Ultra-Hard Challenge</div><div class="instructions"><div class="inst"><span class="instNo">1</span><span>There are <b>8 rounds and 48 questions</b>. Every round has exactly 2 Physics, 2 Chemistry and 2 Biology questions.</span></div><div class="inst"><span class="instNo">2</span><span>The highlighted team has the turn. The Quiz Master may use <b>Switch Turn</b> whenever the opponent is challenged.</span></div><div class="inst"><span class="instNo">3</span><span>Click <b>Correct</b> to add the displayed points. Click <b>Wrong</b> to deduct them. Scores appear live on every question.</span></div><div class="inst"><span class="instNo">4</span><span>If the timer reaches zero, the attempting team is <b>automatically penalised once</b> and the warning sound plays.</span></div><div class="inst"><span class="instNo">5</span><span>The answer stays hidden until the Quiz Master clicks <b>Reveal Answer</b>. The timer stops when the answer is revealed.</span></div><div class="inst"><span class="instNo">6</span><span>Use <b>📊 Scores</b> at any time to see round-wise totals. Use <b>Back to Question</b> to return without losing the current question.</span></div><div class="inst"><span class="instNo">7</span><span>A score screen appears after every round. The final screen automatically compares the totals and declares the winner.</span></div><div class="inst"><span class="instNo">8</span><span>For fairness, accept scientifically equivalent wording. For numerical questions, require the correct value and unit where applicable.</span></div></div><button class="startBtn" onclick="startQuiz()">▶ START THE QUIZ</button><div class="formatLine">Tip: press F for fullscreen • S for scores • Space to reveal the answer</div></div></div>'}
function startQuiz(){ensureAudio();mode='question';r=0;q=0;revealed=false;winnerSoundPlayed=false;render(true)}
function resetQuiz(){clearInterval(timer);r=0;q=0;boys=0;girls=0;revealed=false;sec=0;maxSec=0;scoreLog.length=0;for(const k in qState)delete qState[k];for(const k in turnOverrides)delete turnOverrides[k];winnerSoundPlayed=false;mode='intro';render(false)}
function renderWinner(){clearInterval(timer);const tie=boys===girls;const winner=tie?'':(boys>girls?'BOYS':'GIRLS');if(!winnerSoundPlayed){winnerSoundPlayed=true;setTimeout(()=>playClap(),120)}const bWin=!tie&&boys>girls,gWin=!tie&&girls>boys;document.getElementById('app').innerHTML='<div class="winnerScreen"><div class="winnerWrap"><div class="trophy">'+(tie?'🤝':'🏆')+'</div><div class="winnerKicker">FINAL RESULT</div><div class="winnerTitle">'+(tie?'IT\'S A TIE!':winner+' WIN!')+'</div><div class="winnerMsg">'+(tie?'Both teams finish with the same score.':'Congratulations to '+winner+' on winning the Science Battle!')+'</div><div class="winnerScores"><div class="winnerCard boys '+(bWin?'win':'')+'"><div class="name">BOYS</div><div class="value">'+boys+'</div></div><div class="winnerCard girls '+(gWin?'win':'')+'"><div class="name">GIRLS</div><div class="value">'+girls+'</div></div></div><div class="scoreTable">'+scoreRows()+'</div><div class="winnerActions"><button class="winnerScoreBtn" onclick="mode=\'scoreView\';render(false)">📊 View Scoreboard</button><button class="restartBtn" onclick="resetQuiz()">↻ Restart Quiz</button><button class="iconBtn" onclick="toggleFullscreen()" title="Full screen">⛶</button></div></div></div>'}
function renderScores(roundEnd=false){clearInterval(timer);const rt=roundTotals(r);document.getElementById('app').innerHTML='<div class="scoreScreen"><div class="scoreTop"><button class="iconBtn" onclick="toggleFullscreen()" title="Full screen">⛶</button><h1>'+(roundEnd?'Round Complete':'Live Scoreboard')+'</h1><button class="backBtn" onclick="backToQuestion()">↩ Back to Question</button></div><div class="bigScores"><div class="bigCard boys"><div class="label">BOYS</div><div class="num">'+boys+'</div><div class="roundDelta">This round: '+(rt.boys>=0?'+':'')+rt.boys+'</div></div><div class="bigCard girls"><div class="label">GIRLS</div><div class="num">'+girls+'</div><div class="roundDelta">This round: '+(rt.girls>=0?'+':'')+rt.girls+'</div></div></div><div class="scoreTable">'+scoreRows()+'</div><div class="adjuster"><span style="align-self:center;color:#cbd5e1;font-weight:800">Quick correction:</span><button class="ab" onclick="manualAdjust(\'boys\',1)">Boys +1</button><button class="ab" onclick="manualAdjust(\'boys\',-1)">Boys -1</button><button class="ag" onclick="manualAdjust(\'girls\',1)">Girls +1</button><button class="ag" onclick="manualAdjust(\'girls\',-1)">Girls -1</button>'+(roundEnd?'<button class="nextRoundBtn" onclick="nextRound()">'+(r===rounds.length-1?'Show Winner 🏆':'Start Next Round →')+'</button>':'')+'</div></div>'}
function render(reset=true){const app=document.getElementById('app');if(mode==='intro'){renderIntro();return}if(mode==='winner'){renderWinner();return}if(mode==='scoreView'){renderScores(false);return}if(mode==='roundEnd'){renderScores(true);return}if(reset)startTimer();const x=current(),team=activeTeam(),icon=x.cat==='Physics'?'⚙️':x.cat==='Chemistry'?'⚗️':'🧬';const st=state();
app.innerHTML='<div class="top"><button class="iconBtn" onclick="toggleFullscreen()" title="Full screen">⛶</button><button class="iconBtn" onclick="toggleMute()" title="Sound on/off">'+(muted?'🔇':'🔊')+'</button><div class="round">'+rounds[r].name+' • '+rounds[r].title+' • Q'+(q+1)+'/6</div><div class="turnBadge '+(team==='boys'?'boysTurn':'girlsTurn')+'">'+cap(team)+'\' TURN</div><div class="score"><div class="scoreBox boys '+(team==='boys'?'active':'')+'">BOYS '+boys+'</div><div class="scoreBox girls '+(team==='girls'?'active':'')+'">GIRLS '+girls+'</div></div><button class="iconBtn" onclick="showScores()" title="View scores">📊</button><div class="timerWrap"><div class="clockIcon"></div><span class="timer '+(sec<=10?'low':'')+'">'+sec+'s</span></div></div><div class="bar"><div style="width:'+pct()+'%"></div></div><div class="main"><div class="qPanel"><div class="meta"><span class="pill '+catClass(x.cat)+'">'+x.cat+'</span><span class="pill pts">'+x.pts+' points</span><span class="pill turnPill">'+cap(team)+' answering</span>'+(st.timedOut?'<span class="pill" style="background:#fee2e2;color:#991b1b">Time-up penalty applied</span>':'')+'</div><div class="q">'+x.q+'</div><div class="answer" style="display:'+(revealed?'block':'none')+'">ANSWER: '+x.a+'</div></div><div class="side">'+(x.img?'<img src="'+images[x.img]+'" alt="Science visual">':'<div class="symbol">'+icon+'</div><h2>'+x.cat+'</h2>')+'</div></div><div class="controls"><button class="correct" onclick="awardCorrect()">✓ Correct +'+x.pts+'</button><button class="wrong" onclick="applyPenalty(\'wrong\')">✗ Wrong -'+x.pts+'</button><button class="primary" onclick="reveal()">Reveal Answer</button><button class="switchBtn" onclick="switchTurn()">⇄ Switch Turn</button><button class="scoresBtn" onclick="showScores()">📊 Scores</button><div class="spacer"></div><button class="nav" onclick="prev()">← Prev</button><button class="nav" onclick="next()">Next →</button><button class="danger" onclick="startTimer();render(false)">↻ Timer</button></div>'}
function reveal(){revealed=true;clearInterval(timer);render(false)}
function showScores(){returnMode=mode;mode='scoreView';render(false)}
function backToQuestion(){mode=(returnMode==='winner'?'winner':'question');render(false)}
function switchTurn(){turnOverrides[qKey()]=otherTeam(activeTeam());showToast(cap(activeTeam())+' now answering');render(false)}
function next(){clearInterval(timer);revealed=false;if(q<rounds[r].qs.length-1){q++;mode='question';render(true)}else{mode='roundEnd';render(false)}}
function nextRound(){if(r<rounds.length-1){r++;q=0;revealed=false;mode='question';render(true)}else{mode='winner';render(false)}}
function prev(){clearInterval(timer);revealed=false;if(q>0){q--}else if(r>0){r--;q=rounds[r].qs.length-1}mode='question';render(true)}
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){showToast('Fullscreen not available in this browser')}}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='f'){toggleFullscreen();return}if(mode==='intro'){if(e.key==='Enter')startQuiz();return}if(mode==='winner'){if(e.key.toLowerCase()==='s')showScores();return}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();reveal()}if(e.key.toLowerCase()==='s')showScores()});
render(false);
</script></body></html>
